<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline (max ~8 words)","default":"OpenAI just changed everything"},
    {"id":"kicker","type":"string","label":"Kicker label","default":"AI NEWS"},
    {"id":"accent","type":"color","label":"Accent color","default":"#7CFF6B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

      /* Darkens the top of the frame so white text reads on bright footage. */
      #scrim { position: absolute; inset: 0 0 auto 0; height: 1250px; background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0) 100%); }

      /* Upper third: clear of the Shorts title/description area at the bottom and the buttons on the right. */
      #panel {
        position: absolute; left: 72px; right: 160px; top: 300px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 36px;
      }
      #kicker {
        display: inline-flex; align-items: center; gap: 18px;
        padding: 14px 30px; border-radius: 999px;
        background: var(--accent); color: #0a0a0a;
        font-size: 40px; font-weight: 900; letter-spacing: 0.08em;
      }
      #kicker .dot { width: 18px; height: 18px; border-radius: 50%; background: #0a0a0a; }
      #headline {
        color: #ffffff; font-weight: 900; line-height: 1.02; letter-spacing: -0.035em;
        font-size: 128px; text-wrap: balance;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      #headline .word { display: inline-block; margin-right: 0.22em; }
      #headline .word.hot { color: var(--accent); }
      #bar { width: 260px; height: 14px; border-radius: 7px; background: var(--accent); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hook" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="scrim" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="panel" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="kicker"><span class="dot"></span><span id="kicker-text"></span></div>
        <h1 id="headline"></h1>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      const { headline, kicker, accent } = window.__hyperframes.getVariables();
      document.documentElement.style.setProperty("--accent", accent);
      document.getElementById("kicker-text").textContent = kicker;

      // One span per word; the longest word gets the accent color so the eye has an anchor.
      const el = document.getElementById("headline");
      const words = headline.trim().split(/\s+/);
      const hot = words.reduce((best, w, i) => (w.replace(/\W/g, "").length > words[best].replace(/\W/g, "").length ? i : best), 0);
      words.forEach((w, i) => {
        const span = document.createElement("span");
        span.className = i === hot ? "word hot" : "word";
        span.textContent = w;
        el.appendChild(span);
      });

      // Shrink long headlines until they fit in 4 lines (deterministic: depends only on the text).
      let size = 128;
      while (el.scrollHeight > 128 * 1.02 * 4 + 8 && size > 72) {
        size -= 4;
        el.style.fontSize = size + "px";
      }

      const tl = gsap.timeline({ paused: true });
      tl.from("#scrim", { opacity: 0, duration: 0.3 }, 0)
        .from("#kicker", { y: -40, opacity: 0, duration: 0.35, ease: "back.out(2)" }, 0)
        .from("#headline .word", { y: 80, opacity: 0, scale: 0.8, duration: 0.4, ease: "back.out(1.8)", stagger: 0.07 }, 0.15)
        .from("#bar", { scaleX: 0, duration: 0.5, ease: "power3.out" }, 0.5)
        .to("#panel", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 2.7)
        .to("#scrim", { opacity: 0, duration: 0.3 }, 2.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
