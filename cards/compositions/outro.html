<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Call to action","default":"Follow for daily AI news"},
    {"id":"handle","type":"string","label":"Channel handle (empty to hide)","default":""},
    {"id":"accent","type":"color","label":"Accent color","default":"#7CFF6B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

      #scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62); }
      #panel {
        position: absolute; left: 72px; right: 160px; top: 520px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 44px;
      }
      #text {
        color: #ffffff; font-weight: 900; font-size: 120px; line-height: 1.02; letter-spacing: -0.035em;
        text-wrap: balance;
      }
      #handle {
        display: inline-flex; align-items: center; gap: 20px;
        padding: 18px 36px; border-radius: 999px;
        background: var(--accent); color: #0a0a0a;
        font-size: 52px; font-weight: 900; letter-spacing: -0.01em;
      }
      #handle .plus { font-size: 60px; line-height: 1; }
      #handle.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="scrim" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="panel" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <h1 id="text"></h1>
        <div id="handle"><span class="plus">+</span><span id="handle-text"></span></div>
      </div>
    </div>
    <script>
      const { text, handle, accent } = window.__hyperframes.getVariables();
      document.documentElement.style.setProperty("--accent", accent);
      document.getElementById("text").textContent = text;
      const handleEl = document.getElementById("handle");
      if (handle) document.getElementById("handle-text").textContent = handle.startsWith("@") ? handle : "@" + handle;
      else handleEl.classList.add("hidden");

      const tl = gsap.timeline({ paused: true });
      tl.from("#scrim", { opacity: 0, duration: 0.35 }, 0)
        .from("#text", { y: 70, opacity: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.1)
        .from("#handle", { scale: 0.5, opacity: 0, duration: 0.4, ease: "back.out(2.2)", transformOrigin: "left center" }, 0.45)
        // A gentle pulse on the handle so the eye lands on it.
        .to("#handle", { scale: 1.06, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "left center" }, 1.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["outro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
