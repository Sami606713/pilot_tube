<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"value","type":"string","label":"Big number, e.g. $7.5B","default":"$7.5B"},
    {"id":"label","type":"string","label":"What the number means","default":"Valuation"},
    {"id":"accent","type":"color","label":"Accent color","default":"#7CFF6B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

      /* Upper area, above where the captions sit. */
      #card {
        position: absolute; left: 72px; right: 160px; top: 320px;
        padding: 56px 60px 60px;
        border-radius: 44px;
        background: rgba(10, 10, 12, 0.9);
        border: 3px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        display: flex; flex-direction: column; gap: 18px;
      }
      #value {
        color: var(--accent); font-weight: 900; letter-spacing: -0.04em; line-height: 1;
        font-size: 220px; white-space: nowrap; font-variant-numeric: tabular-nums;
      }
      #label { color: #ffffff; font-weight: 800; font-size: 64px; line-height: 1.1; letter-spacing: -0.02em; }
      #bar { height: 12px; width: 100%; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #bar-fill { height: 100%; width: 100%; background: var(--accent); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stat" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="value"></div>
        <div id="bar"><div id="bar-fill"></div></div>
        <div id="label"></div>
      </div>
    </div>
    <script>
      const { value, label, accent } = window.__hyperframes.getVariables();
      document.documentElement.style.setProperty("--accent", accent);
      document.getElementById("label").textContent = label;

      const valueEl = document.getElementById("value");
      valueEl.textContent = value;

      // Fit the number on one line inside the card.
      const maxWidth = (document.getElementById("card").clientWidth - 120) * 0.9;
      let size = 220;
      while (valueEl.scrollWidth > maxWidth && size > 90) {
        size -= 6;
        valueEl.style.fontSize = size + "px";
      }

      const tl = gsap.timeline({ paused: true });
      tl.from("#card", { y: 60, opacity: 0, scale: 0.92, duration: 0.45, ease: "back.out(1.7)" }, 0)
        .from("#bar-fill", { scaleX: 0, duration: 0.9, ease: "power3.out" }, 0.25)
        .from("#label", { y: 24, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.45);

      // Count up when the value is a single number like "$7.5B", "870M", "40%" (not "1/3" or "July 18").
      const match = value.match(/^([^\d]*)(\d[\d,]*(?:\.\d+)?)([^\d]*)$/);
      if (match) {
        const [, prefix, num, suffix] = match;
        const target = parseFloat(num.replace(/,/g, ""));
        const decimals = (num.split(".")[1] || "").length;
        const useCommas = num.includes(",");
        const format = (n) => {
          const fixed = n.toFixed(decimals);
          return prefix + (useCommas ? Number(fixed).toLocaleString("en-US", { minimumFractionDigits: decimals }) : fixed) + suffix;
        };
        const counter = { n: 0 };
        tl.to(counter, {
          n: target, duration: 0.9, ease: "power2.out",
          onUpdate: () => { valueEl.textContent = format(counter.n); },
        }, 0.2);
      } else {
        tl.from("#value", { scale: 0.6, opacity: 0, duration: 0.4, ease: "back.out(2)", transformOrigin: "left center" }, 0.2);
      }

      tl.to("#card", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 2.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["stat"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
